# B. Tres decisiones de arquitectura y proyección E2/E3

El PDF pide tres decisiones con qué / por qué / qué se gana / qué se pierde. Las que siguen son las que **quedaron en el código**, no las de la propuesta `02` (Next.js, backend TypeScript, tablas `lots` / `custody_events`).

El enunciado avisa que las decisiones de E1 se arrastran el semestre. Cada decisión cierra con lo que deja listo o explícitamente aplazado para E2/E3.

---

## Decisión 1 — Un runtime Python y un portal estático (no Next.js)

**Qué se decidió.** Conservar FastAPI + SQLAlchemy + Alembic. El portal es una SPA Vite/React/TypeScript que el Dockerfile construye a `web/dist` y FastAPI sirve con `StaticFiles`. Un solo proceso HTTP (`web`) más un `worker`. No hay servidor Node en producción.

**Por qué.** El compañero ya tenía Farma, PoW, espacios y el esqueleto de custodia en Python. El servidor son 2 núcleos y 2 GB. Levantar Next.js junto a Uvicorn duplica runtime, RAM y puertos. Migrar el backend a TypeScript en la semana de E1 rompía integraciones que ya hablaban con Farma.

**Qué se gana.** Un deploy (`docker compose build web`), un puerto detrás de Nginx (`127.0.0.1:3000`), el PoW no pelea con el event loop del portal si se corre en el worker o en `compose run`. El catch-all `GET /{full_path:path}` entrega la SPA en `/`, `/trazabilidad`, `/pedidos`, `/pago/...`.

**Qué se pierde.** No hay SSR ni React Server Components. El carrito vive en `localStorage` (`web/src/cart.ts`), no en sesión de servidor. El build de frontend queda acoplado a la imagen Python. Quien esperaba el árbol de rutas de Next tiene que leer `web/src/App.tsx`.

**Trade-off.** Preferimos no reescribir lo que ya compraba insumos, a cambio de un frontend más “clásico”. Si en E3 hiciera falta un canal con UI pesada, se puede volver a separar el frontend; el API ya está detrás de `/api/...`.

**Arrastre.** E2 pide órdenes de compra y lenguaje natural: esos canales entran como nuevas rutas o un adapter que llama `custodia.crear_venta(..., canal=&quot;oc&quot;|&quot;nl&quot;)`, no como un rewrite de framework.

---

## Decisión 2 — Postgres del grupo como fuente de verdad de custodia

**Qué se decidió.** Farma ejecuta el mundo físico (unidades, espacios, fabricación). El historial interno, la genealogía y el stock que muestra el portal salen de Postgres (`unidades.estado`, `lotes`, `movimientos`, `lot_relations`, `ventas`). El visor **no consulta Farma**.

**Por qué.** El enunciado §8.6 es explícito: Farma no guarda el historial del grupo. Un visor que recorriera `GET /spaces/.../products` en cada búsqueda no escala (el PDF lo dice: no cargar todo el historial) y no respondería aguas arriba/abajo ni clientes.

**Qué se gana.** Consultas del visor en el orden de decenas de milisegundos (CTE sobre `lot_relations`, profundad máxima 20). Stock del catálogo = `custodia.stock_disponible` (en_stock, no vencido, no reservado). Independencia si Farma está lenta al mirar un lote.

**Qué se pierde.** Hay que **sincronizar**. El worker llama `registrar_llegadas` cada 20 s; si Farma entrega una unidad y el tick falla, hay una ventana en que el físico existe y custodia no. No usamos two-phase commit. El despacho a Farma (`DISPATCH_FARMA`) está apagado en E1 para no divergir: la unidad se marca `despachada` en Postgres y sigue en el espacio Farma.

**Trade-off.** Consistencia eventual de llegadas a cambio de un modelo consultable y de no mentir en el portal con el inventario crudo de Farma (que incluye vencidos y cosas en tránsito).

**Arrastre.** Recall E2: `origen`, `origen_grupo`, `cuarentena` ya están en el enum de espacios y en `estado` de unidad. Falta el job que, dado un código de lote Farma, recorra `aguas_abajo`, bloquee venta y mueva a `quarantine`. El grafo ya está.

---

## Decisión 3 — Portal síncrono, planta asíncrona (worker + candados)

**Qué se decidió.** El click de “Pagar” es un request HTTP que reserva FEFO, llama Integrapay y redirige. Comprar insumos, fabricar, PoW, cadena de frío y reintento de despachos corren en el **worker** (o en un proceso `producir` aparte), con `os.nice(10)` y `cpus: &quot;1.0&quot;`. Fabricación y venta usan advisory locks de Postgres (`LOCK_FABRICACION`, `LOCK_VENTA`) para no elegir las mismas unidades en paralelo.

**Por qué.** El Anexo de PoW y el propio PDF advierten que un solver greedy puede comerse la CPU del portal. La cámara de frío degrada producto si no se mueve en minutos (`TICK_SECONDS = 20`). Farma limita 250 req/min: el worker topea `MAX_MOVES_PER_TICK = 100`.

**Qué se gana.** El catálogo y el visor siguen respondiendo mientras se resuelve un challenge de 12–13 bits. La recepción no bloquea a `comprar`: se registra `solicitud` pendiente y el tick crea el lote cuando aparece el `batch`.

**Qué se pierde.** Hay latencia de un tick (~20 s) entre que Farma deja el producto y que custodia lo ve. El orquestador `producir(..., tanda=10)` es un bucle con `sleep(20)`, no una cola con DLQ. No hay outbox ni message broker (la propuesta 02 los mencionaba; en 2 GB no se justificó).

**Trade-off.** Operación continua barata versus menos “mensajería empresarial”. E2 puede enchufar una cola **como canal de pedidos** (`Venta.canal`) sin cambiar el worker de frío.

**Arrastre.** Operación 24–48 h (E2) y 48–72 h (E3): el worker ya reintenta `recuperar_pendientes` y no se mata por una excepción en el tick. Falta marcar vencidas en el mismo loop (`registrar_vencidas` existe, el worker aún no lo llama: hueco P2).

---

## Otras decisiones menores que el informe debe poder defender

**Genealogía duplicada a propósito.** `consumos` guarda la unidad exacta. `lot_relations` agrega lote↔lote N:M para el visor. Coste: dos escrituras al nacer un lote. Beneficio: el CTE no recorre `consumos` × `unidades` en cada búsqueda.

**SPA híbrida, no plantillas Jinja.** El HTML de fallback del catch-all existe por si `web/dist` no está; en PROD el visor es React.

**Confirmar pago sin sesión de usuario.** `POST /api/checkout/confirmar` acepta `venta_id` + resultado porque Integrapay redirige al browser. Es el camino de las `backUrls`. Quien conozca un `venta_id` pendiente podría confirmar; en E1 el riesgo se acepta (grupo cerrado, HTTPS). E2 debería firmar las backUrls o validar el `payment_id` contra Integrapay.

**Adapter de Integrapay, no de `/transactions`.** El host real es `.../payments/auth` e `init`. Un base URL con sufijo `/checkout` devolvió 500 y dejó una reserva (venta 1, luego cancelada). El adapter ahora revierte la reserva si `init` falla.

---

## Proyección a Entrega 2 y 3

El PDF recomienda diseñar E1 para no rehacer. Lo que ya está en el esquema y lo que falta:

| Tema E2/E3 | Qué hay hoy | Qué falta |
|---|---|---|
| Órdenes de compra / plazos | `Venta.canal`, `orden_externa_id` | Parser del canal, estados de plazo |
| Pedidos en lenguaje natural | Idem canal | Servicio no determinista; misma reserva FEFO |
| Colas / archivos | Campo `canal` | Adapter de ingestión; no hace falta un broker en el mismo host |
| Recall / retiro | `aguas_abajo`, `clientes_del_lote`, espacio `quarantine`, estado `cuarentena` | Job de bloqueo + notificación en ventana de tiempo |
| Facturación | `venta_items` con precio vigente al comprar | Adapter del sistema de facturas |
| Escasez / trueque entre grupos | `lotes.origen` ∈ {farma_central, distribuidora, produccion}, `origen_grupo` | Registrar lotes que llegan de otra dist. |
| Cuarentena | Enum listo, worker **no** mira ese espacio en llegadas (a propósito) | Usar el espacio cuando Farma emita el retiro |
| Visor a escala | CTE acotado a un código, no dump de `movimientos` | Índices extra si el grafo crece en E3 |
| Autonomía 24–72 h | Worker no muere por un tick fallido; candados | Job de vencimiento; alerta si `en_camino` se pudre |

La decisión de **no** despachar en Farma en E1 (`DISPATCH_FARMA=0`) se revierte cuando el grupo acepte el riesgo de un `PATCH` a `checkOut` a medias: `despachos_pendientes` + `recuperar_pendientes` existen para ese día.

# C. Estrategia de abastecimiento y producción

El PDF pide criterios **concretos**, no una declaración de intenciones. Los números salen de `app/scripts/calcular_requerimientos.py` (objetivo por defecto: 30 por kit), `app/produccion.py` (`tanda=10`) y la corrida PROD de `logs.txt`.

Esta política la ejecuta **quien corre `producir`**, no un cron automático. Eso es deliberado en E1: un job que compre solo contra precio volátil puede vaciar presupuesto o llenar `buffer`. Queda como hueco a automatizar en E2 si el curso lo exige.

---

## Objetivo de planta (E1)

Antes de la fecha de entrega, en **PROD**, acondicionar **al menos 30 unidades de cada kit clínico vendible**. No hace falta que sigan en stock al evaluar; hace falta haberlas producido.

La corrida del 6 de octubre arrancó con:

```text
Producir {KIT-RESP-ADULTO: 30, KIT-PEDIA-FEBRIL: 30, KIT-CURACION: 30,
          KIT-CARDIO-BASICO: 30, KIT-DIABETES: 30, KIT-ANALGESIA: 30,
          KIT-ATB-IV: 30, KIT-VACUNA-INFLU: 30, KIT-GASTRO: 30, KIT-DERMATO: 30}
```

Diez SKU × 30 = 300 kits pedidos. El orquestador redondea cada nivel al `production.batch` de Farma.

---

## Umbrales de reposición

| Nivel | Se dispara cuando | Acción |
|---|---|---|
| Kit | `stock_disponible + fabricaciones_en_camino` del SKU &amp;lt; **una tanda (10)** y el objetivo de campaña no está cubierto | `fabricar` ese kit por el mínimo múltiplo de batch que no pase lo que cabe en `packaging` |
| Intermedio (BLI, FRA, …) | La receta del kit en tanda pide más de lo que hay en espacios usables | `fabricar` el intermedio, de mayor profundidad a menor |
| Insumo (API, EXC, LAM, …) | `planificar` indica demanda y no hay suficiente `en_camino` | `comprar` el múltiplo de batch |

`stock_disponible` ignora `reservada`, `despachada`, `consumida`, `vencida` y lo que vence en menos de 1 h.

No reponemos “al 20% de capacidad de bodega”. Reponemos **por tanda de kits**, porque el cuello de botella real es `packaging` (150 unidades de huella; `calcular_requerimientos` avisa si un lote no cabe).

---

## Cantidades de compra

Siempre múltiplo de `tamano_lote(sku)` (`catalogo()[sku][&quot;production&quot;][&quot;batch&quot;]`). `comprar` rechaza cualquier otra cantidad.

Ejemplos de la primera ola PROD (`logs.txt`):

| SKU | Cantidad comprada (solicitud) | Notas |
|---|---|---|
| `API-AMOXI-500` | 250 (#1) | Insumo del blíster del kit respiratorio |
| `API-IBUPRO-400` | 150 (#2) | Compartido con otros kits |
| Más tarde `API-AMOXI-500` | 100 (#71) | Segunda ola cuando la tanda siguiente pidió más |

`calcular_requerimientos` explota la receta de **todos** los kits a la vez: un excipiente compartido se compra una sola vez, redondeado al batch, no diez veces. Eso importa: el enunciado dice que los insumos compartidos son intencionales.

La tanda de fabricación de kits no es 30 de un golpe: `producir(..., tanda=10)` arma de a 10 para no saturar acondicionamiento. Farma, en PROD, entregó lotes de kit de 3 o 6 unidades (p. ej. #56: 6 × `KIT-RESP-ADULTO`), que son múltiplos de su batch.

---

## Bodega externa (`buffer`)

Farma cobra por hora en el espacio `buffer`. Criterio:

- **Productos de ambiente:** no se dejan en `buffer`. `producir` los despeja a `bodega`. Si el orquestador ve acondicionamiento lleno de intermedios que no avanzan, los vacía a bodega (`_vaciar_acondicionamiento`), no al buffer.
- **Productos de frío:** el worker mueve `checkIn`/`bodega` → `cold` si hay cupo; **solo si `libres(&quot;cold&quot;) == 0`** usa `buffer`. Al nacer en `packaging`, lo mismo (`nacidas_en_acondicionamiento`).
- **Aceptar el costo:** únicamente como válvula de la cámara, nunca como almacén de campaña. Una tanda extra “porque el precio bajó” **no** se autoriza si eso implica pagar buffer.

Capacidades: se leen de `GET /farma-central/spaces` (`app/espacios.py`). No se hardcodean IDs (cambian entre DEV y PROD).

---

## Vencimiento y merma

- **Orden de consumo:** FEFO. `unidades_disponibles` ordena por `packaging` primero (ya están en la mesa) y después `vence_en` ascendente. Margen: no se usa lo que vence en **menos de 1 hora** (`timedelta(hours=1)`).
- **Portal:** `stock_disponible` usa el mismo margen. El catálogo no ofrece vencidos ni reservados.
- **Worker:** aún **no** llama `registrar_vencidas` cuando Farma desaparece unidades. El helper existe. Hasta que se enganche, un vencido puede seguir en Postgres como `en_stock` un tick más: el margen de 1 h cubre parte de esa ventana. Hueco declarado, no escondido.
- **Frío:** sacar un SKU frío de cámara degrada `expiresAt`. Por eso las frías se mueven a `packaging` al final de `fabricar`, y si el challenge falla se `_devolver_al_frio`.

---

## Sensibilidad al precio (±50 %)

El precio de venta del portal es el de `GET /farma-central/market/prices` en el momento de `validar_carrito` / checkout, no un valor fijo. El **costo** de insumo es el de Farma al comprar.

| Shock | Política concreta |
|---|---|
| Precio de **venta** del kit **+50 %** | No adelantar tandas. Seguir el umbral de 10. El margen mejora; producir de más inmoviliza `packaging` y riesgo de merma. |
| Precio de **venta** **−50 %** | Una tanda adicional (10 kits, redondeada a batch) **solo si** `libres(&quot;bodega&quot;)` o `libres(&quot;cold&quot;)` cubren la huella. Si la única holgura es `buffer`, **no**. |
| Costo de **insumo** +50 % | No comprar colchón. `calcular_requerimientos` ya deja un resto por redondeo de batch; ese resto es el único buffer de material. |
| Costo de insumo −50 % | Comprar el batch que `planificar` pida para la tanda actual, no “llenar la bodega”. El shared API (`API-AMOXI-500`) se compra cuando **cualquier** kit de la tanda lo necesita, no por kit.

No hay job que lea el mercado cada hora. Quien opera planta aplica la tabla. Si E2 exige autonomía 24 h, el lugar del if es `produccion.planificar`, no el portal.

# D. Modelo de custodia y trazabilidad

Entregable central del diseño (§12.1 D y §8.6). Farma no conserva el historial interno del grupo: si no se escribe aquí, no se reconstruye.

El módulo **único** que escribe las tablas de custodia es `app/custodia.py`. `operaciones.py` es la fachada hacia Farma: nadie debería llamar `farma_client` desde un script de planta sin pasar por ahí.

---

## Qué se registra y cuándo

| Evento del enunciado | Cuándo | Tablas | `movimientos.tipo` |
|---|---|---|---|
| Recepción de un insumo comprado | Worker ve unidades nuevas en un espacio (salvo cuarentena) cuyo `batch` aún no está en `unidades` | `solicitudes` pasa a `recibida`; `lotes` origen=`farma_central`; `unidades` `en_stock` | `recepcion` |
| Generación de un producto fabricado | Igual, pero la solicitud es `tipo=fabricacion` | `lotes` origen=`produccion`; `_materializar_relaciones` | `generacion` |
| Traslado entre espacios | Después de un `PATCH /products/{id}` exitoso (`operaciones.mover` o worker de frío) | `unidades.espacio_actual` | `traslado` |
| Consumo en acondicionamiento | Justo después de que Farma acepta `POST /products` de una fabricación | `consumos` (unidad, lote padre, solicitud); unidad `consumida`, sin espacio | `consumo` |
| Venta (intención) | **Antes** de llamar a Integrapay, al reservar FEFO | `ventas`, `venta_items`, `venta_unidades` estado `pendiente`; unidad `reservada` | `venta` |
| Despacho | Tras pago `pagada`, `confirmar_despacho` | `venta_unidades.despachada`; unidad `despachada` | `despacho` |
| Vencimiento | Helper `registrar_vencidas` (aún no en el loop del worker) | unidad `vencida` | `vencimiento` |
| Cuarentena | Enum listo; E2 | — | `cuarentena` |

Reglas de consistencia local (una transacción SQLAlchemy `SessionLocal.begin`):

- `registrar_fabricacion` revierte todo si falta un `_id` en custodia. No hay consumo huérfano.
- `asignar_unidades_a_venta` exige `estado == en_stock`. Si falla a mitad, la transacción no confirma.
- Llegadas son **idempotentes**: `_id` ya conocido se ignora.
- Un lote se ata a **a lo más una** solicitud (`lotes.solicitud_id` unique).

---

## Modelo de datos

Esquema en `app/models.py`. Índices y CHECK con `naming_convention` de Alembic (migración `e1a7c0d1e2f3`: `lot_relations`, `reservada`, `venta_items`).

| Tabla | Rol |
|---|---|
| `solicitudes` | Compra o fabricación pedida a Farma. `challenge_id`, `llega_en`, `pendiente\|recibida\|fallida` |
| `lotes` | Nacimiento conjunto. `codigo` único (el `batch` de Farma). `origen` = farma_central \| produccion \| distribuidora. `origen_grupo` para trueque E3 |
| `unidades` | PK = `_id` de Farma. Estado actual y espacio |
| `consumos` | Unidad exacta gastada en una solicitud de fabricación. Una unidad se consume una vez |
| `lot_relations` | Arista N:M padre→hijo, `cantidad`, `solicitud_id`. Unique `(parent, child)` |
| `movimientos` | Bitácora por unidad (no se borra) |
| `ventas` | Pedido. `canal` default `portal`. `transaccion_id` Integrapay unique |
| `venta_items` | Líneas con `precio_unitario` vigente al confirmar el carro |
| `venta_unidades` | Qué `_id` se llevó cada venta; `pendiente` hasta el despacho |

**N:M consumido↔generado.** Un lote de `BLI-AMOXI-500` tiene tres padres de insumo. Un lote de `KIT-RESP-ADULTO` tiene tres padres acondicionados. El mismo lote de `API-AMOXI-500` puede ser padre de varios blísteres. El visor recorre `lot_relations`, no asume 1:1.

Espacios (`ESPACIOS`): `checkIn`, `bodega`, `cold`, `buffer`, `packaging`, `checkOut`, `quarantine`. El worker **no** sincroniza cuarentena: un retiro no debe reaparecer como llegada.

---

## Las cuatro preguntas (§8.6)

Implementación: `app/trazabilidad.py`. API: `GET /api/trazabilidad/{codigo}`. UI: `/trazabilidad?lote=`.

### 1. Unidades del lote X en inventario y dónde

- **Procedimiento:** `unidades_en_inventario(codigo)`.
- **Consulta:** `unidades` del lote con `estado IN (en_stock, reservada)`, ordenadas por espacio.
- **Mecanismo:** lookup por `lotes.codigo` (único). No recorre Farma. El visor también agrega conteos por espacio y por estado (`consultar`).

### 2. En qué productos se consumió X y qué lotes se generaron

- **Procedimiento:** `aguas_abajo(codigo)`.
- **Consulta:** CTE recursivo en `lot_relations` donde el lote es **padre**, profundidad &amp;lt; 20.
- **Mecanismo:** cada fila trae `codigo`, `sku`, `origen`, `cantidad_relacion` (unidades de ese padre que alimentaron al hijo). La UI muestra profundidad 1 aparte de la recursiva.

### 3. A qué clientes se entregó X, cuándo, en qué pedido

- **Procedimiento:** `clientes_del_lote(codigo)` → `_clientes`.
- **Consulta:** `ventas ⋈ venta_unidades ⋈ lotes` filtrado a `ventas.estado = &#x27;pagada&#x27;`.
- **Mecanismo:** “se entregaron” no incluye reservas ni errores. Devuelve nombre, email, `pagada_en`, `transaccion_id`, lista de `_id`. `consultar` también arma `entregas` para el nodo verde del grafo.

### 4. De qué lotes de insumo se produjo X y de dónde venían

- **Procedimiento:** `aguas_arriba(codigo)`.
- **Consulta:** CTE al revés: el lote es **hijo**, se sube a padres hasta que el origen es `farma_central` o `distribuidora` (hojas del grafo).
- **Mecanismo:** cada nodo lleva `origen` y `origen_grupo`. El visor etiqueta FARMA CENTRAL / DISTRIBUIDORA n / PROPIO.

`consultar` junta las cuatro, más KPIs (sku, cantidad inicial, vencimiento efectivo = min `vence_en` de unidades vivas, conservación por catálogo Farma, `consulta_ms`). Medido en PROD en ~16–26 ms sobre un lote de kit.

No se barre `movimientos` entero. Eso es el requisito de rendimiento del visor.

---

## Qué pasa si se cae a medias

Escenario del PDF: producto físicamente entregado y venta/custodia a medias.

| Falla | Mitigación |
|---|---|
| Integrapay `init` falla (HTTP 5xx, URL mal armada) | `iniciar_checkout` hace `marcar_pago(error)` + `liberar_reserva`. La venta 1 de PROD quedó colgada **antes** de este rollback; se canceló a mano con confirmar. El rollback está en el código que corre ahora. |
| El cliente no vuelve de la pasarela | Unidades siguen `reservada`. No se despachan. Hay que expirar reservas (no hay TTL aún; hueco). Cancelar en Integrapay pega la `backUrl` y libera. |
| Pago ok, proceso muere antes de `confirmar_despacho` | `finalizar` es **idempotente**: si ya está `pagada`, no vuelve a despachar. El worker llama `recuperar_pendientes` cada tick. |
| `DISPATCH_FARMA=1` y el `PATCH` a checkOut falla | La fila `venta_unidades` sigue `pendiente`; el worker reintenta. No se marca `despachada` en custodia hasta que Farma acepta **y** `confirmar_despacho` corre. En E1 el flag está en **0**: Farma no se entera del despacho, pero el rastro comprador↔unidad sí existe. |
| Farma acepta fabricación y Postgres no guarda consumos | Log `CRITICAL` con sku, challenge, `_id`. No hay XA. Planta corrige a mano; no se sigue fabricando a ciegas (candado). |
| Dos fabricaciones eligen las mismas unidades | `pg_try_advisory_lock(4000001)`. La segunda espera o falla explícito. |
| Lote llega sin solicitud pendiente | `registrar_llegadas` no crea lote huérfano; log de error. |

El visor, si el lote no está, responde 404. No inventa genealogía.
